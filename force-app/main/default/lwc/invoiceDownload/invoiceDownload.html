<template>
    <lightning-card title="Invoice Details">

        <template if:true={invoice}>
            <div class="slds-p-around_medium">

                <!-- Header -->
                <p><b>Invoice Number:</b> {invoice.Name}</p>
                <p><b>Account:</b> {invoice.Account__r.Name}</p>
                        
                <template for:each={lines} for:item="line">
                            <div key={line.Id} class="slds-box slds-m-top_medium">

                                <p><b>Product:</b> {line.Product__r.Name}</p>
                                <p><b>Qty:</b> {line.Quantity__c}</p>
                                <p><b>Unit Price:</b> ₹ {line.Unit_Price__c}</p>
                                <p><b>GST (18%):</b> ₹ {line.tax}</p>
                                <p><b>Total:</b> ₹ {line.total}</p>

                            </div>
                        </template>


                <!-- Total -->
                <h3 class="slds-m-top_medium">
                    Total Amount: ₹ {grandTotal}
                </h3>

                <template if:true={fileUrl}>
                    <div class="slds-m-top_large">

                        <!-- Download Button 
                        <lightning-button 
                            label="Download Invoice PDF"
                            onclick={handleDownload}
                            variant="brand"
                            class="slds-m-bottom_medium">
                        </lightning-button> -->


                    </div>
                </template>

            </div>
        </template>

        <template if:false={invoice}>
            <div class="slds-p-around_medium">
                No Invoice Found
            </div>
        </template>

    </lightning-card>
</template>
